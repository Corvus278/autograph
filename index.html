<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280" />
    <!--
      Цвет темы повторяет `--color-surface` из `src/app/styles/app.css` — фон `body`:
      им браузер красит обвязку установленного приложения, и она не спорит с экраном.
      `color-scheme` тёмная: иначе до применения стилей страница успевает мигнуть белым,
      а системные элементы (полосы прокрутки) остаются светлыми.
    -->
    <meta name="theme-color" content="#15171b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <title>Autograph — генератор рукописного текста</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>

name: Checks

# Гейты отгрузки: на каждый PR в master и перед каждым деплоем (deploy.yml
# вызывает этот workflow и ждёт его). Гейт коммита (.husky/pre-commit) их не
# заменяет: vitest там идёт только по изменённым файлам, и его можно обойти
# `--no-verify`.
on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

# Версия Node — та же, что в mise.toml (здесь и в deploy.yml): setup-node
# mise.toml не читает, поэтому число повторено руками.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      # Без typecheck: он идёт отдельной job, чтобы красный статус сразу
      # говорил, какой из гейтов упал.
      - run: npm run lint:es
      - run: npm run lint:css
      - run: npm run lint:format
      - run: npm run lint:fsd

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  # Юнит-тесты — самый долгий гейт: разбиты на два шарда, иначе они одни
  # задавали бы время всего прогона.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - run: npm test -- --shard=${{ matrix.shard }}/2

  # Сборка идёт внутри теста: он собирает dist сам при обеих базах.
  test-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - run: npm run test:pwa

  test-stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      # Браузер кешируется по версии Playwright из lock-файла: другая версия
      # ждёт другую сборку Chromium.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Системные библиотеки в кеш не попадают — их ставит apt на каждом прогоне.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:stories
